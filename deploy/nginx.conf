# nginx site for the public map. Installed to /etc/nginx/sites-available/chicago-guide.
# deploy.sh publishes each build to /var/www/chicago-guide/releases/<timestamp> and points "current" at it.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/chicago-guide/current;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Hashed build files never change, so cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Always revalidate the page itself so new deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
